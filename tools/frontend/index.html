<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客工作台 · Deep Reflection（邃思）</title>
<script>
try {
  const savedTheme = localStorage.getItem('blog-workbench-theme');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.dataset.theme = 'dark';
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="/static/style.css?v=cloudflare-v4">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.13/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

<header class="topbar">
  <div class="brand">博客工作台</div>
  <div class="top-actions">
    <button id="btn-theme" class="btn ghost theme-toggle" title="切换明暗主题">深色模式</button>
    <button id="btn-images" class="btn ghost">图片库</button>
    <button id="btn-trash" class="btn ghost">回收站 <span id="trash-count"></span></button>
    <button id="btn-preview" class="btn ghost">预览博客</button>
    <button id="btn-settings" class="btn ghost">站点设置</button>
    <button id="btn-publish" class="btn primary">一键发布</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <span>文章管理</span>
      <div class="side-actions">
        <button id="btn-import-md" class="btn small ghost">导入 MD</button>
        <button id="btn-new" class="btn small">+ 新建</button>
      </div>
      <input id="md-input" type="file" accept=".md,.markdown,text/markdown" multiple style="display:none">
    </div>
    <div class="post-filters">
      <input id="post-search" placeholder="搜索标题、标签或摘要">
      <select id="post-filter">
        <option value="all">全部文章</option>
        <option value="published">仅已发布</option>
        <option value="draft">仅草稿</option>
        <option value="sticky">仅置顶</option>
      </select>
    </div>
    <div class="bulk-bar">
      <label class="check-all"><input id="check-all" type="checkbox"> 全选</label>
      <select id="bulk-action">
        <option value="">批量操作…</option>
        <option value="add-tags">添加标签</option>
        <option value="draft">转为草稿</option>
        <option value="publish">转为发布</option>
        <option value="unpin">取消置顶</option>
        <option value="delete">移入回收站</option>
      </select>
      <button id="btn-bulk-apply" class="tb-btn">执行</button>
    </div>
    <div id="post-list" class="post-list"></div>
  </aside>

  <section class="editor">
    <input id="f-title" class="title-input" placeholder="文章标题">
    <div class="meta-row">
      <label>日期<input id="f-date" type="date"></label>
      <label>标签<input id="f-tags" placeholder="逗号分隔，如 视觉, 笔记"></label>
      <label>置顶<input id="f-sticky" type="number" min="0" step="1" value="0"></label>
      <label>状态<select id="f-publish"><option value="true">发布</option><option value="false">草稿</option></select></label>
    </div>
    <input id="f-desc" class="desc-input" placeholder="一句话摘要">
    <div class="toolbar">
      <button class="tb-btn" data-insert="code">代码块</button>
      <button class="tb-btn" data-insert="formula-block">公式 $$</button>
      <button class="tb-btn" data-insert="formula-inline">行内公式</button>
      <button class="tb-btn" data-insert="link">链接</button>
      <button class="tb-btn" data-insert="table">表格</button>
      <button id="btn-upload-img" class="tb-btn accent">插入图片</button>
      <span class="tb-tip">支持粘贴 / 拖拽图片到编辑区</span>
      <input id="img-input" type="file" accept="image/*" style="display:none">
    </div>
    <textarea id="f-body" class="body-input" placeholder="用 Markdown 写正文…"></textarea>
    <div class="editor-footer">
      <span id="save-hint" class="hint"></span>
      <button id="btn-delete" class="btn danger">移入回收站</button>
      <button id="btn-save" class="btn primary">保存</button>
    </div>
  </section>

  <section class="preview-pane">
    <div class="preview-head">实时预览</div>
    <div id="preview" class="preview-content"></div>
  </section>
</main>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">站点首页设置<button class="close" data-close="settings-modal">×</button></div>
    <div class="modal-body">
      <label>站点名称<input id="s-name"></label>
      <label>座右铭 / 副标题<input id="s-motto"></label>
      <label>轮播标语（每行一条）<textarea id="s-inspiring" rows="5"></textarea></label>
      <label>标语切换间隔 (ms)<input id="s-timeout" type="number" step="500"></label>
      <label>每页文章数<input id="s-pagesize" type="number" min="1"></label>
    </div>
    <div class="modal-foot"><span id="settings-hint" class="hint"></span><button id="btn-save-settings" class="btn primary">保存设置</button></div>
  </div>
</div>

<!-- 回收站 -->
<div id="trash-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head">文章回收站<button class="close" data-close="trash-modal">×</button></div>
    <div class="modal-body"><div class="modal-tip">删除的文章会先保留在这里，可以恢复；彻底删除后只能通过 Git 历史找回。</div><div id="trash-list" class="resource-list"></div></div>
  </div>
</div>

<!-- 图片库 -->
<div id="images-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head">图片资源库<button class="close" data-close="images-modal">×</button></div>
    <div class="modal-body"><div class="modal-tip">被文章引用的图片不可直接删除；点击“插入”可将图片加入当前文章。</div><div id="image-list" class="image-grid"></div></div>
  </div>
</div>

<!-- 发布弹窗 -->
<div id="publish-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head">发布到线上<button class="close" data-close="publish-modal">×</button></div>
    <div class="modal-body">
      <div class="publish-section-title">本次变更</div>
      <div id="publish-changes" class="publish-changes">正在读取…</div>
      <label>提交信息<input id="p-message" value="更新文章"></label>
      <div id="publish-log" class="publish-log"></div>
      <div id="deploy-status" class="deploy-status"></div>
    </div>
    <div class="modal-foot">
      <button id="btn-check-deploy" class="btn ghost">查看部署状态</button>
      <button id="btn-do-publish" class="btn primary">确认发布</button>
    </div>
  </div>
</div>

<script src="/static/app.js?v=cloudflare-v4"></script>
</body>
</html>
